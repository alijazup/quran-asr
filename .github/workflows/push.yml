name: Push to Replicate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token_can_push: true
          replicate_api_token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Log in to Replicate Registry
        run: echo "${{ secrets.REPLICATE_API_TOKEN }}" | docker login r8.im -u alijazup --password-stdin

      - name: Push to Replicate
        run: cog push r8.im/alijazup/quran-asr
