build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
  python_version: "3.10"
  run:
    - "pip install --no-cache-dir Cython setuptools wheel"
    - "pip install --no-cache-dir nemo_toolkit[asr]"
  python_packages:
    - "soundfile==0.12.1"
    - "numpy==1.26.4"
    - "huggingface_hub>=0.23.0"
predict: "predict.py:Predictor"
