image: "r8.im/alijazup/quran-asr"
build:
  gpu: false
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "curl"
  python_version: "3.10"
  python_packages:
    - "torch>=2.0.0"
    - "torchaudio>=2.0.0"
    - "nemo_toolkit[asr]>=1.20.0"
    - "soundfile"
    - "librosa"
    - "huggingface_hub"
  run:
    - "mkdir -p /src/weights && curl -L -o /src/weights/fastconformer-quran.nemo https://huggingface.co/mohammed/fastconformer-quran-ar/resolve/main/phase1_top3/phase1_top3_wer0.0038.nemo"
predict: "predict.py:Predictor"
