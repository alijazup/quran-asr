image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "torch"
    - "transformers"
    - "faster-whisper"
    - "ctranslate2"
    - "soundfile"
    - "numpy"
    - "huggingface_hub"
  run:
    - "mkdir -p /src/weights/model && python3 -c \"import ctranslate2; converter = ctranslate2.converters.TransformersConverter('tarteel-ai/whisper-base-ar-quran'); converter.convert('/src/weights/model', quantization='float16')\""
predict: "predict.py:Predictor"

