image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "11.8"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "transformers"
    - "accelerate"
    - "faster-whisper"
    - "soundfile"
    - "numpy"
    - "torch"
  run:
    - "python3 -c \"from faster_whisper import WhisperModel; WhisperModel('tarteel-ai/whisper-base-ar-quran', download_root='/src/weights')\""
predict: "predict.py:Predictor"
