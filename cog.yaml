image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "faster-whisper"
    - "soundfile"
    - "numpy"
    - "torch"
    - "huggingface_hub"
    - "nvidia-cublas-cu12"
    - "nvidia-cudnn-cu12"
  run:
    - "mkdir -p /src/weights/model && python3 -c \"from huggingface_hub import snapshot_download; snapshot_download('OdyAsh/faster-whisper-base-ar-quran', local_dir='/src/weights/model', local_dir_use_symlinks=False)\""
predict: "predict.py:Predictor"
