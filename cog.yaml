image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "torch"
    - "transformers"
    - "accelerate"
    - "soundfile"
    - "numpy"
    - "huggingface_hub"
  run:
    - "mkdir -p /src/weights/model && python3 -c \"from huggingface_hub import snapshot_download; snapshot_download(repo_id='tarteel-ai/whisper-base-ar-quran', local_dir='/src/weights/model', local_dir_use_symlinks=False, ignore_patterns=['runs/*'])\""
predict: "predict.py:Predictor"
