image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "11.8"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "transformers"
    - "accelerate"
    - "faster-whisper"
    - "soundfile"
    - "numpy"
    - "torch"
    - "huggingface_hub"
  run:
    - "mkdir -p /src/weights/model && python3 -c \"from huggingface_hub import snapshot_download; snapshot_download(repo_id='OdyAsh/faster-whisper-base-ar-quran', local_dir='/src/weights/model')\""
predict: "predict.py:Predictor"
