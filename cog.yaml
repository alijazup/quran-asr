image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "12.4"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "faster-whisper"
    - "soundfile"
    - "numpy"
    - "torch"
    - "huggingface_hub"
    - "nvidia-cublas-cu12"
    - "nvidia-cudnn-cu12"
  run:
    - "mkdir -p /src/weights/model && python3 -c \"from faster_whisper import download_model; download_model('large-v3-turbo', output_dir='/src/weights/model')\""
predict: "predict.py:Predictor"
