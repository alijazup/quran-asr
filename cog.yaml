build:
  gpu: false
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "build-essential"
    - "python3-dev"
  python_version: "3.10"
  run:
    - "pip install --no-cache-dir Cython wheel setuptools"
    - "pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu"
    - "pip install --no-cache-dir nemo_toolkit[asr]==1.23.0 soundfile huggingface_hub"
    - "pip install --no-cache-dir 'pydantic==1.10.13' 'fastapi==0.98.0'"
predict: "predict.py:Predictor"
