build:
  gpu: true
  cuda: "11.8"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "build-essential"
    - "python3-dev"
  python_version: "3.10"
  run:
    - "pip install --no-cache-dir Cython wheel setuptools"
    - "pip install --no-cache-dir 'numpy<2.0.0'"
    - "pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cu118"
    - "pip install --no-cache-dir nemo_toolkit[asr] soundfile 'huggingface_hub==0.23.5'"
    - "pip install --no-cache-dir 'pydantic==1.10.13' 'fastapi==0.98.0' 'wandb<0.16.0' 'numpy<2.0.0' 'huggingface_hub==0.23.5'"
    - "python3 -c \"from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='NightPrince/stt-ar-fastconformer-quran-minshawi', filename='quran_minshawi_final.nemo', local_dir='/root/model')\""
predict: "predict.py:Predictor"
