image: "r8.im/alijazup/quran-asr"
build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - "ffmpeg"
  python_version: "3.10"
  python_packages:
    - "torch"
    - "transformers"
    - "faster-whisper"
    - "ctranslate2"
    - "soundfile"
    - "numpy"
    - "huggingface_hub"
  run:
    - "mkdir -p /src/weights/model && ct2-transformers-converter --model tarteel-ai/whisper-base-ar-quran --output_dir /src/weights/model --copy_files tokenizer.json preprocessor_config.json --quantization float16"
predict: "predict.py:Predictor"

